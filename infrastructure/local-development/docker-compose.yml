# Local development dependencies for NEXORA. Nothing here is exposed beyond
# 127.0.0.1. Start with:  docker compose -f infrastructure/local-development/docker-compose.yml up -d
name: nexora-dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_dev # local development only
      POSTGRES_DB: cvforge
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - nexora-pg:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexora -d cvforge']
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional local model for CVForge suggestions and the CodeAtlas chatbot.
  # Enable with:  docker compose ... --profile ai up -d
  # then:         docker compose ... exec ollama ollama pull qwen2.5:7b-instruct
  ollama:
    image: ollama/ollama:latest
    profiles: ['ai']
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - nexora-ollama:/root/.ollama

volumes:
  nexora-pg:
  nexora-ollama:
